spring:
  application:
    name: mangala-portfolio-service

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:mangala_dev}?currentSchema=${DB_SCHEMA:portfolio}
    username: ${DB_USERNAME:portfolio_service}
    password: ${DB_PASSWORD:portfolio123}

  flyway:
    enabled: true
    schemas: portfolio
    default-schema: portfolio
    locations: classpath:/migration
    baseline-on-migrate: true

  data:
    redis:
      url: ${REDIS_URL:redis://localhost:6379}

  # Kafka Configuration
  kafka:
    enabled: ${KAFKA_ENABLED:true}
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: portfolio-service
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    producer:
      acks: all
      retries: 3
      batch-size: 16384
      linger-ms: 10
      buffer-memory: 33554432

  # Security is handled by gateway - this service trusts gateway headers
  # No OAuth2 resource server needed - user context comes from X-User-* headers

server:
  port: 8182

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    root: INFO
    org.flywaydb: DEBUG
    org.mangala.portfolio: DEBUG
